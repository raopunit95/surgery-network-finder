name: Refresh inventory

# DISABLED until GOOGLE_SERVICE_ACCOUNT_JSON is in the repo secrets. Without it
# this fails — and emails — every night. Add the secret, then enable in Actions.

on:
  schedule:
    - cron: '30 20 * * *'      # 02:00 IST daily
  workflow_dispatch:            # and a manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild from the Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run refresh:sheet

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "inventory unchanged"
            exit 0
          fi
          git config user.name  "inventory-bot"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Refresh inventory ($(date -u +%Y-%m-%d))"
          git push
